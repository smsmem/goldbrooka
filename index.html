<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Goldy Brooks</title>
<style>
html,body{margin:0;height:100%;background:#140f26;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none}
</style></head><body>
<canvas id="c"></canvas>
<script>
const W=390,H=780,DUR=75;
const DEBUG=/debug/.test(location.search);   // add ?debug to the URL to see the RNG line
const S=.8,OX=68.8,OY=151.2;                   // bed group transform (world = O + S*local)
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let scale=1;const dpr=Math.min(window.devicePixelRatio||1,3);
function resize(){scale=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*scale+'px';cv.style.height=H*scale+'px';cv.width=Math.round(W*scale*dpr);cv.height=Math.round(H*scale*dpr);}
addEventListener('resize',resize);resize();

/* ---------- helpers ---------- */
function clamp(v,a,b){return v<a?a:v>b?b:v}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function txt(s,x,y,size,color,align,weight){ctx.font=(weight||'bold')+' '+size+'px "Trebuchet MS",Arial,sans-serif';ctx.textAlign=align||'center';ctx.fillStyle=color;ctx.fillText(s,x,y);}
function inR(p,x,y,w,h){return p.x>=x&&p.x<=x+w&&p.y>=y&&p.y<=y+h}

/* ---------- audio ---------- */
let AC=null;
function au(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,d,type,v,slide,delay){if(!AC)return;const t0=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+d);g.gain.setValueAtTime(v||.12,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+.02);}
function ding(){tone(880,.35,'sine',.14);tone(1320,.4,'sine',.1,0,.08);}
function buzz(){tone(120,.55,'sawtooth',.16,70);}
function thump(p){tone(75,.2,'sine',.1+p*.3,38);}
function snoreSnd(){tone(95,.6,'sawtooth',.07,55);}
function tugSnd(){tone(320,.12,'triangle',.09,170);}
function fluffSnd(){tone(200,.15,'sine',.08,420);}
function blip(){tone(520,.06,'sine',.04,600);}
function winSnd(){[523,659,784,1046].forEach((f,i)=>tone(f,.3,'triangle',.13,0,i*.14));}
function loseSnd(){[440,370,311,233].forEach((f,i)=>tone(f,.35,'sawtooth',.09,0,i*.18));}

/* ---------- show content (original, generic game-show) ---------- */
const Q=[
 {q:'Name something you do before bed',a:[['Brush teeth',38],['Check phone',27],['Read',19],['Pee',12]]},
 {q:'Name a reason you can’t fall asleep',a:[['Noise',34],['Stress',28],['Too hot',21],['Snoring',11]]},
 {q:'Name something in a bear’s house',a:[['Honey',41],['Bowls',24],['Beds',20],['Chairs',11]]},
 {q:'Name a bedtime snack',a:[['Cookies',36],['Cereal',25],['Warm milk',22],['Toast',13]]},
 {q:'Name a sound that wakes you up',a:[['Alarm',44],['Dog',23],['Thunder',19],['Phone',10]]}
];

/* ---------- state ---------- */
let G=null,state='title',best=0;
const ptr={};   // pointerId -> {bar:'R'|'L'|'T'|'B', x, y}
try{best=+localStorage.getItem('gb_best4')||0}catch(e){}
function newGame(){
  const r=Math.random();
  const out=r<.3?'deep':r<.7?'light':'none';   // predetermined outcome (Ragency lever)
  G={t:0,s:12,angle:50,target:50,score:0,chain:0,chainT:0,out:out,f:1,
     startle:0,wobA:0,wob:0,nextEv:5,cue:0,evKind:'ding',nextSnore:10,snoreWarn:0,
     qi:Math.floor(Math.random()*Q.length),rev:[0,0,0,0],xs:0,xFlash:0,dingFlash:0,qAdv:0,
     nextStomp:1.2,shake:0,zz:[],zzT:0,mode:'zone',sweet:50,w:24,eye:.8,head:{x:200,y:520},over:null,overT:0,
     msg:'',msgT:0,msgC:'#fff',issues:[],st:{},lab:'',labC:'#5cf09a',held:{},sfxT:0,
     wedgie:6,pband:[0,34],nextKick:5,       // bottom bar: PJ pants
     puff:58,band:[40,72],                   // top bar: pillow
     lvl:55,wband:[40,66],gulpT:6,wet:0,spillT:0,pourFx:0};  // left bar: water
}
newGame();
function say(m,c){G.msg=m;G.msgT=1.7;G.msgC=c||'#fff';}
function fireEv(){
  if(G.evKind==='x'){G.xs=Math.min(3,G.xs+1);G.xFlash=1.2;G.startle+=16;if(!G.held.B)G.wedgie+=8;G.shake=.5;buzz();}
  else{const i=G.rev.indexOf(0);if(i>=0)G.rev[i]=1;G.dingFlash=1;G.startle+=5;ding();if(G.rev.indexOf(0)<0)G.qAdv=3;}
}
function snoreHit(){
  snoreSnd();G.wobA=(Math.random()<.5?-1:1)*10;if(!G.held.B)G.wedgie+=6;
  if(G.lvl>84&&G.spillT<=0){G.lvl=Math.min(100,G.lvl+14);say('slosh! glass too full','#ff9a9a');}
}
function endGame(type){
  state='end';G.over=type;G.overT=0;for(const k in ptr)delete ptr[k];
  const bonus=type==='deep'?1000+Math.round((DUR-G.t)*10):type==='light'?300:0;
  G.bonus=bonus;G.score=Math.round(G.score+bonus);
  if(G.score>best){best=G.score;try{localStorage.setItem('gb_best4',best)}catch(e){}}
  if(type==='none')loseSnd();else winSnd();
}

/* ---------- update ---------- */
function update(dt){
  G.t+=dt;G.msgT=Math.max(0,G.msgT-dt);G.sfxT=Math.max(0,G.sfxT-dt);
  G.angle+=(G.target-G.angle)*Math.min(1,dt*14);
  G.startle*=Math.pow(.35,dt);
  G.nextSnore-=dt;
  if(G.nextSnore<=0){G.snoreWarn=.7;G.nextSnore=10+Math.random()*5;}
  if(G.snoreWarn>0){G.snoreWarn-=dt;if(G.snoreWarn<=0)snoreHit();}
  G.wobA*=Math.pow(.04,dt);G.wob=G.wobA*Math.sin(G.t*26);
  // hidden lever steering toward predetermined outcome
  const prog=G.t/DUR;
  const T=G.out==='deep'?Math.min(100,prog*125):G.out==='light'?70*prog:25*prog;
  const f=G.f=clamp(1-(G.s-T)*.012,.65,1.4);
  const iss=[],st={};

  // 1) recline angle
  const ea=clamp(G.angle+G.wob,0,90);
  G.sweet=clamp(62-.42*G.s+Math.sin(G.t*.5)*5+G.startle-(G.puff-56)*.12,8,86);
  G.w=(26-G.s*.07)*f;
  const d=Math.abs(ea-G.sweet);
  if(d<G.w/2)st.angle='ok';
  else{st.angle='bad';iss.push(ea<G.sweet?{k:'flat',t:'BED TOO FLAT – TILT UP'}:{k:'up',t:'BED TOO UPRIGHT – TILT DOWN'});}

  const Hd_=G.held;
  // 2) PJ pants (bottom bar): they ride up into a wedgie, drag back to straight
  G.nextKick-=dt;
  if(G.nextKick<=0){if(!Hd_.B){G.wedgie+=12+Math.random()*8;say('*squirms* – PJs riding up','#ffe27d');}G.nextKick=(4+Math.random()*3.5)*f;}
  if(!Hd_.B)G.wedgie+=dt*(2.4+.8*Math.sin(G.t*.6))/f;
  G.wedgie=clamp(G.wedgie,0,100);
  G.pband=[0,34*f];
  if(G.wedgie>G.pband[1]){st.wedgie='bad';iss.push({k:'up',t:'WEDGIE! DRAG HER PJs STRAIGHT'});}
  else st.wedgie=G.wedgie>G.pband[1]*.72?'warn':'ok';

  // 3) pillow (top bar): squashes flat, fluff it – not too flat, not too puffy
  if(!Hd_.T)G.puff-=dt*3.1/f;
  G.puff=clamp(G.puff,0,100);
  const half=15*f;G.band=[56-half,56+half];
  if(G.puff<G.band[0]){st.pillow='bad';iss.push({k:'up',t:'PILLOW TOO FLAT – FLUFF IT'});}
  else if(G.puff>G.band[1]){st.pillow='bad';iss.push({k:'up',t:'PILLOW TOO PUFFY – PAT IT DOWN'});}
  else st.pillow=(G.puff-G.band[0]<5||G.band[1]-G.puff<5)?'warn':'ok';

  // 4) water (left bar): she sips and gulps, keep the glass at just enough
  G.gulpT-=dt;
  if(G.gulpT<=0){if(!Hd_.L){G.lvl-=12+Math.random()*8;say('*gulp*','#8fd0ff');}G.gulpT=(5+Math.random()*4)*f;}
  if(!Hd_.L)G.lvl-=dt*2.2/f;
  G.lvl=clamp(G.lvl,0,100);
  const wc=52+12*Math.sin(G.t*.31+1),wh=13*f;G.wband=[wc-wh,wc+wh];
  G.spillT=Math.max(0,G.spillT-dt);G.wet=Math.max(0,G.wet-dt);G.pourFx=Math.max(0,G.pourFx-dt);
  if(G.lvl>=96&&G.spillT<=0){G.wet=2.2;G.spillT=1.5;G.lvl=78;G.s=Math.max(0,G.s-5);say('OVERFLOW – SPLASHED HER PJs!','#ff9a9a');buzz();}
  if(G.wet>0){st.water='bad';iss.push({k:'up',t:'SPLASHED HER PJs!'});}
  else if(G.lvl<G.wband[0]){st.water='bad';iss.push({k:'flat',t:'THIRSTY – ADD WATER'});}
  else if(G.lvl>G.wband[1]){st.water='bad';iss.push({k:'up',t:'GLASS TOO FULL – POUR SOME OUT'});}
  else st.water=(G.lvl-G.wband[0]<4||G.wband[1]-G.lvl<4)?'warn':'ok';

  G.issues=iss;G.st=st;
  const good=iss.length===0;
  G.mode=good?'zone':iss[0].k;
  G.lab=good?'JUST RIGHT – zzz':iss[0].t+(iss.length>1?'  (+'+(iss.length-1)+')':'');
  G.labC=good?'#5cf09a':'#ff9a9a';
  if(good){
    G.chainT+=dt;G.chain=Math.min(5,Math.floor(G.chainT/2));
    G.s+=dt*4*(1+G.chain*.12);
    G.score+=dt*10*(1+G.chain);
  }else{
    G.chainT=0;G.chain=0;
    G.s-=dt*(1.4+.9*iss.length+(st.angle==='bad'?Math.min(d-G.w/2,40)*.03:0));
  }
  G.s=clamp(G.s,0,100);
  // TV
  G.nextEv-=dt;
  if(G.nextEv<=0&&G.cue<=0){G.cue=.9;G.evKind=Math.random()<.4?'x':'ding';G.nextEv=7+Math.random()*4;}
  if(G.cue>0){G.cue-=dt;if(G.cue<=0)fireEv();}
  if(G.qAdv>0){G.qAdv-=dt;if(G.qAdv<=0){G.qi=(G.qi+1)%Q.length;G.rev=[0,0,0,0];G.xs=0;}}
  G.xFlash=Math.max(0,G.xFlash-dt);G.dingFlash=Math.max(0,G.dingFlash-dt*1.6);
  // bears
  G.nextStomp-=dt;
  if(G.nextStomp<=0){thump(prog);G.shake=Math.max(G.shake,.08+prog*.3);G.nextStomp=1.9-1.4*prog;}
  G.shake*=Math.pow(.02,dt);
  // eyes + zzz
  const eyeT=G.mode==='zone'?clamp(.8-.7*G.s/100,.08,.8):G.mode==='flat'?1.25:.5;
  G.eye+=(eyeT-G.eye)*Math.min(1,dt*6);
  G.zzT+=dt;
  if(G.mode==='zone'&&G.s>18&&G.zzT>.6){G.zzT=0;G.zz.push({x:G.head.x+20,y:G.head.y-20,l:0});}
  G.zz.forEach(z=>{z.l+=dt;z.y-=dt*28;z.x+=dt*10});
  G.zz=G.zz.filter(z=>z.l<1.8);
  if(G.s>=100)endGame('deep');
  else if(G.t>=DUR)endGame(G.s>=55?'light':'none');
}

/* ---------- drawing ---------- */
function drawRoom(){
  const g=ctx.createLinearGradient(0,0,0,700);g.addColorStop(0,'#2a2147');g.addColorStop(1,'#3d2f63');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,700);
  ctx.fillStyle='#2e2230';ctx.fillRect(0,668,W,H-668);
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(0,668,W,4);
  const fl=.16+.04*Math.sin(performance.now()/130);
  const rg=ctx.createRadialGradient(195,164,10,195,300,380);
  rg.addColorStop(0,'rgba(130,175,255,'+fl+')');rg.addColorStop(1,'rgba(130,175,255,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,W,700);
}
function drawTV(){
  const x=20,y=64,w=350,h=200;
  ctx.fillStyle='#0c0c12';rr(x,y,w,h,14);ctx.fill();
  const g=ctx.createLinearGradient(0,y+8,0,y+h-8);g.addColorStop(0,'#1d3fae');g.addColorStop(1,'#0b1c63');
  ctx.fillStyle=g;rr(x+8,y+8,w-16,h-16,8);ctx.fill();
  ctx.fillStyle='#f5c842';rr(x+14,y+12,w-28,24,6);ctx.fill();
  txt('★ SURVEY SHOWDOWN ★',x+w/2,y+29,14,'#7a2b00');
  for(let i=0;i<3;i++)txt('✕',x+w-60+i*15,y+29,12,i<G.xs?'#d10f0f':'#b8962f');
  const q=Q[G.qi];
  txt(q.q,x+w/2,y+55,12,'#fff');
  for(let i=0;i<4;i++){
    const col=i%2,row=i>>1,sx=x+14+col*164,sy=y+66+row*38;
    if(G.rev[i]){
      ctx.fillStyle='#2c6bff';rr(sx,sy,158,32,6);ctx.fill();
      txt(q.a[i][0],sx+10,sy+21,13,'#fff','left');
      txt(''+q.a[i][1],sx+148,sy+21,14,'#ffe27d','right');
    }else{
      ctx.fillStyle='#12297a';rr(sx,sy,158,32,6);ctx.fill();
      ctx.strokeStyle='#6f8cff';ctx.lineWidth=1.5;ctx.stroke();
      ctx.fillStyle='#2a46b5';ctx.beginPath();ctx.arc(sx+79,sy+16,11,0,7);ctx.fill();
      txt(''+(i+1),sx+79,sy+21,13,'#cfd9ff');
    }
  }
  ctx.fillStyle='#222';rr(183,231,24,20,4);ctx.fill();
  ctx.fillStyle='#f1c9a5';ctx.beginPath();ctx.arc(195,222,9,0,7);ctx.fill();
  ctx.fillStyle='#cfcfcf';ctx.beginPath();ctx.arc(195,218,9,Math.PI,0);ctx.fill();
  ctx.strokeStyle='#ddd';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(206,236);ctx.lineTo(214,228);ctx.stroke();
  for(let k=0;k<3;k++){
    ctx.fillStyle='#ff8fb1';ctx.beginPath();ctx.arc(46+k*24,232,8,0,7);ctx.fill();rr(38+k*24,240,16,12,4);ctx.fill();
    ctx.fillStyle='#8fe0ff';ctx.beginPath();ctx.arc(298+k*24,232,8,0,7);ctx.fill();rr(290+k*24,240,16,12,4);ctx.fill();
  }
  ctx.fillStyle='rgba(255,255,255,.05)';ctx.beginPath();ctx.moveTo(x+10,y+10);ctx.lineTo(x+150,y+10);ctx.lineTo(x+60,y+h-10);ctx.lineTo(x+10,y+h-10);ctx.fill();
  if(G.cue>0){
    ctx.fillStyle='rgba(0,0,0,.45)';rr(x+8,y+8,w-16,h-16,8);ctx.fill();
    if(Math.floor(performance.now()/180)%2===0)txt('SURVEY SAYS…',x+w/2,y+118,26,'#ffe27d');
  }
  if(G.xFlash>0){ctx.globalAlpha=clamp(G.xFlash,0,1);txt('✕',x+w/2,y+160,150,'#ff2a2a');ctx.globalAlpha=1;}
  if(G.dingFlash>0){ctx.fillStyle='rgba(255,226,125,'+G.dingFlash*.3+')';rr(x+8,y+8,w-16,h-16,8);ctx.fill();txt('DING!',x+w/2,y+118,30,'rgba(255,255,255,'+G.dingFlash+')');}
}
const SC={ok:'#5cf09a',warn:'#ffe27d',bad:'#ff6b6b'};
function drawHUD(){
  txt('SCORE '+Math.floor(G.score),16,24,15,'#fff','left');
  txt('GOLDY BROOKS',W/2,24,13,'#c9b8ff');
  const left=Math.max(0,Math.ceil(DUR-G.t));
  txt(Math.floor(left/60)+':'+('0'+left%60).slice(-2),W-16,24,15,'#fff','right');
  const prog=clamp(G.t/DUR,0,1);
  ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(24,48);ctx.lineTo(362,48);ctx.stroke();
  ctx.font='20px serif';ctx.textAlign='center';ctx.fillStyle='#fff';
  ctx.fillText('🏠',366,54);
  ctx.fillText('🐻',24+prog*320,54);
  txt('SLEEP',16,292,12,'#c9b8ff','left');
  ctx.fillStyle='rgba(0,0,0,.4)';rr(66,278,250,18,9);ctx.fill();
  ctx.fillStyle=G.mode==='zone'?'#5cf09a':'#7a8cff';rr(66,278,Math.max(6,250*G.s/100),18,9);ctx.fill();
  txt('×'+(1+G.chain),345,293,16,G.chain?'#ffe27d':'#9a90c0');
  // status chips
  const chips=[['angle','ANGLE'],['wedgie','PJs'],['pillow','PILLOW'],['water','WATER']];
  chips.forEach((c,i)=>{
    const x=14+i*84,s=G.st[c[0]]||'ok',bad=s==='bad'&&Math.floor(performance.now()/250)%2===0;
    ctx.fillStyle='rgba(0,0,0,.35)';rr(x,306,78,20,10);ctx.fill();
    ctx.fillStyle=SC[s];ctx.beginPath();ctx.arc(x+12,316,5+(bad?1.5:0),0,7);ctx.fill();
    txt(c[1],x+46,321,11,s==='ok'?'#d8f8e4':SC[s]);
  });
  txt(G.lab,W/2,346,14,G.labC);
  if(G.snoreWarn>0)txt('💤 bear snoring next door…',W/2,366,12,'#ffe27d');
  if(G.msgT>0){ctx.globalAlpha=clamp(G.msgT,0,1);txt(G.msg,W/2,392,15,G.msgC);ctx.globalAlpha=1;}
}
function drawFrame(){
  ctx.lineWidth=2;ctx.strokeStyle='#c4c4d8';
  ctx.fillStyle='#ececf5';rr(34,452,26,204,10);ctx.fill();ctx.stroke();
  ctx.fillStyle='#d9d9e8';rr(34,630,312,22,8);ctx.fill();ctx.stroke();
  ctx.fillStyle='#b9b9cf';ctx.fillRect(46,650,10,16);ctx.fillRect(324,650,10,16);
  ctx.fillStyle='#fbfbff';rr(52,592,282,40,12);ctx.fill();ctx.strokeStyle='#cfcfe2';ctx.stroke();
}
function drawGoldy(){
  const P={x:215,y:592};
  const ea=clamp(G.angle+G.wob,0,90),a=ea*Math.PI/180;
  const dir={x:-Math.cos(a),y:-Math.sin(a)},nor={x:Math.sin(a),y:-Math.cos(a)};
  // hinged back panel + the head pillow (thickness = fluff)
  const pry=6+G.puff*.17,lumpy=G.puff>G.band[1],flat=G.puff<G.band[0];
  ctx.save();ctx.translate(P.x,P.y);ctx.rotate(a-Math.PI);
  ctx.fillStyle='#ffffff';ctx.strokeStyle='#c4c4d8';ctx.lineWidth=2;rr(-30,-18,196,18,8);ctx.fill();ctx.stroke();
  const pf=1+G.fluffFlash*.08;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(150,pry,44*pf,pry*pf,0,0,7);ctx.fill();ctx.stroke();
  if(lumpy){ctx.beginPath();ctx.ellipse(122,pry*1.6,10,6,0,0,7);ctx.fill();ctx.stroke();ctx.beginPath();ctx.ellipse(180,pry*1.5,9,6,0,0,7);ctx.fill();ctx.stroke();}
  if(flat){ctx.strokeStyle='#dcdcec';ctx.beginPath();ctx.moveTo(124,pry);ctx.lineTo(176,pry);ctx.stroke();}
  ctx.restore();
  // legs in pink PJ pants (under duvet) + seat
  const T0={x:P.x+nor.x*18+dir.x*4,y:P.y+nor.y*18+dir.y*4};
  const T1={x:P.x+nor.x*18+dir.x*88,y:P.y+nor.y*18+dir.y*88};
  ctx.lineCap='round';
  ctx.strokeStyle='#f7a8c8';ctx.lineWidth=30;ctx.beginPath();ctx.moveTo(T0.x,T0.y);ctx.lineTo(300,580);ctx.stroke();
  // torso (shirt)
  ctx.strokeStyle='#8fb6ff';ctx.lineWidth=36;ctx.beginPath();ctx.moveTo(T0.x+dir.x*8,T0.y+dir.y*8);ctx.lineTo(T1.x,T1.y);ctx.stroke();
  // PJ waistband: rides up her back as the wedgie grows
  const wu=8+G.wedgie*.3;
  const Wt={x:T0.x+dir.x*wu,y:T0.y+dir.y*wu};
  ctx.strokeStyle='#f7a8c8';ctx.lineWidth=37;ctx.beginPath();ctx.moveTo(T0.x,T0.y);ctx.lineTo(Wt.x,Wt.y);ctx.stroke();
  ctx.strokeStyle='#ffffff';ctx.lineWidth=4;ctx.lineCap='butt';
  ctx.beginPath();ctx.moveTo(Wt.x-nor.x*18,Wt.y-nor.y*18);ctx.lineTo(Wt.x+nor.x*18,Wt.y+nor.y*18);ctx.stroke();ctx.lineCap='round';
  ctx.fillStyle='#fff';
  for(let k=0;k<5;k++){const u=4+k*((wu+20)/5),v=((k%2)?7:-7);ctx.beginPath();ctx.arc(T0.x+dir.x*(u-14)+nor.x*v,T0.y+dir.y*(u-14)+nor.y*v,1.8,0,7);ctx.fill();}
  // seat: back of the PJs bunching into the mattress (wedgie stress lines)
  if(G.wedgie>=33){
    const n=G.wedgie>=55?4:2,bx=T0.x-nor.x*14,by=T0.y-nor.y*14;
    ctx.strokeStyle=G.wedgie>=55?'#d0457a':'#e57aa5';ctx.lineWidth=2;
    for(let k=0;k<n;k++){const o=-12+k*8;ctx.beginPath();ctx.moveTo(bx+dir.x*o-nor.x*2,by+dir.y*o-nor.y*2);ctx.lineTo(bx+dir.x*(o+10)+nor.x*8,by+dir.y*(o+10)+nor.y*8);ctx.stroke();}
    if(G.wedgie>=55){ctx.save();ctx.translate(bx-10,by+6);const sq=Math.sin(G.t*14)*2;txt('≈',sq,0,16,'#ff6b9a');ctx.restore();}
  }
  if(G.tugFlash>0){ctx.globalAlpha=clamp(G.tugFlash,0,1);txt('TUG!',T0.x-6,T0.y+34,13,'#ffe27d');ctx.globalAlpha=1;}
  if(G.wet>0){ctx.globalAlpha=clamp(G.wet,0,1)*.8;ctx.fillStyle='#3d7fe0';ctx.beginPath();ctx.ellipse((T0.x+T1.x)/2,(T0.y+T1.y)/2,22,13,a,0,7);ctx.fill();ctx.globalAlpha=1;}
  // head (rests on the pillow)
  const lift=G.puff*.2-4+(lumpy?Math.sin(G.t*9)*1.2:0);
  const Hd={x:T1.x+dir.x*32+nor.x*(8+lift),y:T1.y+dir.y*32+nor.y*(8+lift)};
  G.head={x:OX+S*Hd.x,y:OY+S*Hd.y};
  ctx.strokeStyle='#f1c9a5';ctx.lineWidth=13;ctx.beginPath();ctx.moveTo(T1.x,T1.y);ctx.lineTo(Hd.x,Hd.y);ctx.stroke();
  ctx.save();ctx.translate(Hd.x-nor.x*8+dir.x*8,Hd.y-nor.y*8+dir.y*8);ctx.rotate(a-Math.PI);
  ctx.fillStyle='#4b2e1c';ctx.beginPath();ctx.ellipse(0,0,30,26,0,0,7);ctx.fill();ctx.restore();
  ctx.strokeStyle='#4b2e1c';ctx.lineWidth=17;ctx.beginPath();ctx.moveTo(Hd.x+dir.x*10,Hd.y+dir.y*10);ctx.lineTo(Hd.x+dir.x*52-nor.x*6,Hd.y+dir.y*52-nor.y*6);ctx.stroke();
  ctx.fillStyle='#f1c9a5';ctx.beginPath();ctx.arc(Hd.x,Hd.y,22,0,7);ctx.fill();
  ctx.fillStyle='#5a3820';ctx.beginPath();ctx.arc(Hd.x,Hd.y,23.5,Math.PI*.82,Math.PI*1.92);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.ellipse(Hd.x+9,Hd.y-18,13,6,-.25,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(Hd.x-14,Hd.y+5,10,19,0,0,7);ctx.fill();
  ctx.strokeStyle='#7a4e2e';ctx.lineWidth=2;ctx.beginPath();ctx.arc(Hd.x-2,Hd.y-2,19,Math.PI*1.1,Math.PI*1.6);ctx.stroke();
  const ex=Hd.x+10,ey=Hd.y-2,o=G.eye,ry=Math.max(.8,7*o);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(ex,ey,6,ry,0,0,7);ctx.fill();
  if(o>.25){ctx.fillStyle='#3a2415';ctx.beginPath();ctx.arc(ex+2,ey-1,Math.min(3.2,ry*.55),0,7);ctx.fill();}
  ctx.strokeStyle='#3a2415';ctx.lineWidth=1.6;ctx.beginPath();ctx.ellipse(ex,ey,6,ry,0,0,7);ctx.stroke();
  const brow=G.mode==='flat'?-4:G.mode==='up'?2:0;
  ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(ex-6,ey-10+brow);ctx.lineTo(ex+6,ey-11+brow+(G.mode==='up'?-3:0));ctx.stroke();
  ctx.fillStyle='#d9a98a';ctx.beginPath();ctx.moveTo(Hd.x+21,Hd.y+1);ctx.lineTo(Hd.x+27,Hd.y+6);ctx.lineTo(Hd.x+20,Hd.y+7);ctx.fill();
  ctx.strokeStyle='#b5524a';ctx.fillStyle='#8a2f2f';ctx.lineWidth=2;
  if(G.mode==='zone'&&G.s>55){ctx.beginPath();ctx.ellipse(Hd.x+14,Hd.y+12,3.5,2.5+2*Math.sin(G.t*3),0,0,7);ctx.fill();}
  else if(G.mode==='flat'){ctx.beginPath();ctx.ellipse(Hd.x+14,Hd.y+12,3,4,0,0,7);ctx.fill();}
  else if(G.mode==='up'){ctx.beginPath();ctx.moveTo(Hd.x+9,Hd.y+13);ctx.lineTo(Hd.x+12,Hd.y+10);ctx.lineTo(Hd.x+15,Hd.y+14);ctx.lineTo(Hd.x+19,Hd.y+11);ctx.stroke();}
  else{ctx.beginPath();ctx.arc(Hd.x+14,Hd.y+9,4,.2,Math.PI-.2);ctx.stroke();}
  // duvet over the legs (hip/seat left visible)
  ctx.fillStyle='#fff';ctx.strokeStyle='#c9c9de';ctx.lineWidth=2;ctx.beginPath();
  ctx.moveTo(248,598);ctx.bezierCurveTo(246,556,268,548,290,552);ctx.bezierCurveTo(312,556,326,552,334,574);ctx.lineTo(336,598);ctx.closePath();ctx.fill();ctx.stroke();
  // arm: remote, or reaching for the water glass
  const reach=G.lvl<G.wband[0];
  const tgt=reach?{x:(69-OX)/S,y:(585-OY)/S}:{x:262,y:548},L=reach?150+40*Math.sin(G.t*5):74;
  const Sh={x:T1.x-dir.x*8+nor.x*4,y:T1.y-dir.y*8+nor.y*4};
  const tx=tgt.x-Sh.x,ty=tgt.y-Sh.y,dl=Math.hypot(tx,ty),k=Math.min(1,L/dl);
  const hand={x:Sh.x+tx*k,y:Sh.y+ty*k};
  ctx.strokeStyle='#7aa5f5';ctx.lineWidth=14;ctx.beginPath();ctx.moveTo(Sh.x,Sh.y);ctx.lineTo(hand.x,hand.y);ctx.stroke();
  ctx.fillStyle='#f1c9a5';ctx.beginPath();ctx.arc(hand.x,hand.y,7,0,7);ctx.fill();
  if(!reach){ctx.fillStyle='#111';rr(hand.x+2,hand.y-5,16,8,2);ctx.fill();}
}
function drawNightstand(){
  ctx.fillStyle='#a06c48';rr(42,608,56,8,3);ctx.fill();
  ctx.fillStyle='#8a5a3c';ctx.fillRect(46,614,48,72);
  ctx.fillStyle='#6e452d';rr(51,622,38,26,3);ctx.fill();rr(51,654,38,26,3);ctx.fill();
  ctx.fillStyle='#d9b38c';ctx.beginPath();ctx.arc(70,635,2.2,0,7);ctx.fill();ctx.beginPath();ctx.arc(70,667,2.2,0,7);ctx.fill();
  if(G.spillT>0){ctx.fillStyle='rgba(110,190,255,.8)';for(let k=0;k<3;k++){const yy=612+((performance.now()/6+k*25)%70);ctx.beginPath();ctx.ellipse(48+k*20,yy,2.2,3.5,0,0,7);ctx.fill();}}
  const gx=56,gy=562,gw=28,gh=46,lv=G.lvl/100*(gh-4);
  ctx.fillStyle='rgba(110,190,255,.78)';ctx.fillRect(gx+3,gy+gh-2-lv,gw-6,lv);
  const y1=gy+gh-2-G.wband[1]/100*(gh-4),y2=gy+gh-2-G.wband[0]/100*(gh-4);
  ctx.strokeStyle='rgba(92,240,154,.9)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(gx-5,y1);ctx.lineTo(gx,y1);ctx.moveTo(gx-5,y2);ctx.lineTo(gx,y2);ctx.moveTo(gx+gw,y1);ctx.lineTo(gx+gw+5,y1);ctx.moveTo(gx+gw,y2);ctx.lineTo(gx+gw+5,y2);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(gx+3,gy+gh);ctx.lineTo(gx+gw-3,gy+gh);ctx.lineTo(gx+gw,gy);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.14)';ctx.fillRect(gx+5,gy+4,4,gh-10);
  if(G.pourFx>0){ctx.strokeStyle='rgba(140,205,255,.9)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(gx+gw/2,520);ctx.lineTo(gx+gw/2,gy+gh-2-lv);ctx.stroke();}
}
/* box of four bars: right = recline, left = water, top = pillow, bottom = PJ pants */
const BX={x0:40,x1:350,y0:408,y1:718};          // corners
const VT=[424,702],HT=[56,334];                 // track ranges
const vY=v=>VT[1]-v*(VT[1]-VT[0]);
const hX=v=>HT[0]+v*(HT[1]-HT[0]);
function handle(x,y,s,label,held){
  const pulse=s==='bad'?1+.12*Math.sin(performance.now()/90):1;
  ctx.fillStyle=s==='bad'?'#ff6b6b':s==='warn'?'#ffd36b':'#ffe27d';
  ctx.beginPath();ctx.arc(x,y,(held?16:14)*pulse,0,7);ctx.fill();
  ctx.strokeStyle=s==='bad'?'#9a1f1f':'#a8741a';ctx.lineWidth=3;ctx.stroke();
  txt(label,x,y+4,10,'#4a2a00');
}
function vbar(cx,v,lo,hi,top,bot,name,s,lab,held){
  ctx.fillStyle=held?'rgba(255,255,255,.16)':'rgba(0,0,0,.42)';rr(cx-15,BX.y0,30,BX.y1-BX.y0,15);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx,VT[0]);ctx.lineTo(cx,VT[1]);ctx.stroke();
  const a=vY(clamp(hi,0,1)),b=vY(clamp(lo,0,1));
  ctx.fillStyle='rgba(80,230,140,.6)';rr(cx-11,a,22,Math.max(6,b-a),8);ctx.fill();
  txt(top,cx,BX.y0+11,8,'#c9b8ff');txt(bot,cx,BX.y1-4,8,'#c9b8ff');
  ctx.save();ctx.translate(cx,(VT[0]+VT[1])/2);ctx.rotate(-Math.PI/2);txt(name,0,-17,9,'rgba(255,255,255,.45)');ctx.restore();
  handle(cx,vY(clamp(v,0,1)),s,lab,held);
}
function hbar(cy,v,lo,hi,left,right,name,s,lab,held){
  ctx.fillStyle=held?'rgba(255,255,255,.16)':'rgba(0,0,0,.42)';rr(BX.x0,cy-14,BX.x1-BX.x0,28,14);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(HT[0],cy);ctx.lineTo(HT[1],cy);ctx.stroke();
  const a=hX(clamp(lo,0,1)),b=hX(clamp(hi,0,1));
  ctx.fillStyle='rgba(80,230,140,.6)';rr(a,cy-10,Math.max(6,b-a),20,8);ctx.fill();
  txt(left,BX.x0+4,cy+3,8,'#c9b8ff','left');txt(right,BX.x1-4,cy+3,8,'#c9b8ff','right');
  txt(name,(HT[0]+HT[1])/2,cy+(cy<500?-17:24),9,'rgba(255,255,255,.5)');
  handle(hX(clamp(v,0,1)),cy,s,lab,held);
}
function drawControls(){
  const st=G.st,hd=G.held;
  ctx.strokeStyle='rgba(201,184,255,.35)';ctx.lineWidth=2;rr(4,BX.y0-4,382,BX.y1-BX.y0+8,20);ctx.stroke();
  hbar(422,G.puff/100,G.band[0]/100,G.band[1]/100,'FLAT','PUFFY','PILLOW',st.pillow||'ok','☁',hd.T);
  hbar(704,G.wedgie/100,G.pband[0]/100,G.pband[1]/100,'STRAIGHT','WEDGIE','PJ PANTS',st.wedgie||'ok','👖',hd.B);
  vbar(22,G.lvl/100,G.wband[0]/100,G.wband[1]/100,'FULL','EMPTY','WATER',st.water||'ok','💧',hd.L);
  const ea=clamp(G.angle+G.wob,0,90);
  vbar(368,G.target/90,(G.sweet-G.w/2)/90,(G.sweet+G.w/2)/90,'UP','FLAT','RECLINE',st.angle||'ok',Math.round(G.target)+'°',hd.R);
  ctx.fillStyle='#fff';const ye=vY(ea/90);ctx.beginPath();ctx.moveTo(350,ye);ctx.lineTo(343,ye-5);ctx.lineTo(343,ye+5);ctx.fill();
  txt('drag every side of the box back into its green zone',W/2,748,11,'#c9b8ff');
  txt('right RECLINE · left WATER · top PILLOW · bottom PJs',W/2,764,10,'#9a90c0');
  if(DEBUG)txt('RNG: '+G.out.toUpperCase()+'  lever f '+G.f.toFixed(2),W-8,777,9,'rgba(255,255,255,.4)','right');
}
function drawPart(){
  G.zz.forEach(z=>{ctx.globalAlpha=clamp(1.8-z.l,0,1);txt('Z',z.x,z.y,12+z.l*10,'#cfe0ff');});
  ctx.globalAlpha=1;
}
function dim(a){ctx.fillStyle='rgba(10,6,24,'+a+')';ctx.fillRect(0,0,W,H);}
function drawTitle(){
  dim(.84);
  txt('GOLDY BROOKS',W/2,160,38,'#ffe27d');
  txt('get everything just right before the bears get home',W/2,190,13,'#c9b8ff');
  const L=[['📐','RIGHT – RECLINE','up/down – not too flat, not too upright'],
           ['🥛','LEFT – WATER','up/down – keep the glass at just enough'],
           ['☁️','TOP – PILLOW','not too flat, not too puffy'],
           ['👖','BOTTOM – PJ PANTS','they ride up – drag them straight again']];
  L.forEach((l,i)=>{const y=246+i*58;
    ctx.fillStyle='rgba(255,255,255,.1)';rr(28,y-26,334,48,12);ctx.fill();
    ctx.font='24px serif';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText(l[0],56,y+7);
    txt(l[1],84,y-2,15,'#fff','left');txt(l[2],84,y+15,11,'#c9b8ff','left','normal');});
  txt('every side of the box drifts – all four green = she sleeps',W/2,500,11,'#9a90c0');
  txt('BEST '+best,W/2,532,15,'#ffe27d');
  const p=.75+.25*Math.sin(performance.now()/300);
  ctx.globalAlpha=p;txt('TAP TO PLAY',W/2,590,28,'#5cf09a');ctx.globalAlpha=1;
}
function drawEnd(){
  dim(.78);
  const info={deep:['DEEP SLEEP 😴','Bears tiptoe out. Big win!','#7dffb0'],light:['LIGHT SLEEP 🌙','She wakes and slips out the window.','#ffe27d'],none:['CAUGHT! 🐻','The bears found her awake.','#ff8a8a']}[G.over];
  txt(info[0],W/2,230,34,info[2]);
  txt(info[1],W/2,264,15,'#fff');
  txt('SCORE '+G.score,W/2,330,28,'#fff');
  if(G.bonus)txt('+'+G.bonus+' sleep bonus',W/2,358,14,'#ffe27d');
  txt('BEST '+best,W/2,392,16,'#c9b8ff');
  if(DEBUG)txt('predetermined outcome was: '+G.out.toUpperCase(),W/2,430,12,'rgba(255,255,255,.5)');
  if(G.overT>.8){const p=.75+.25*Math.sin(performance.now()/300);ctx.globalAlpha=p;txt('TAP TO PLAY AGAIN',W/2,520,24,'#5cf09a');ctx.globalAlpha=1;}
}
function draw(){
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(G.shake>.01)ctx.translate((Math.random()-.5)*G.shake*14,(Math.random()-.5)*G.shake*14);
  drawRoom();drawTV();drawHUD();
  ctx.save();ctx.translate(OX,OY);ctx.scale(S,S);drawFrame();drawGoldy();ctx.restore();
  drawNightstand();drawControls();drawPart();
  ctx.restore();
  if(state==='title')drawTitle();
  if(state==='end')drawEnd();
}

/* ---------- input (multi-touch: slide + pour at once) ---------- */
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
function barAt(p){
  if(p.x>=338&&p.y>=398&&p.y<=730)return'R';
  if(p.x<=52&&p.y>=398&&p.y<=730)return'L';
  if(p.y>=392&&p.y<=452)return'T';
  if(p.y>=676&&p.y<=736)return'B';
  return null;
}
function sfx(f){if(G.sfxT<=0){f();G.sfxT=.12;}}
function setBar(q,p,first){
  const b=q.bar;
  if(b==='R'){G.target=clamp((VT[1]-p.y)/(VT[1]-VT[0]),0,1)*90;}
  else if(b==='L'){const v=clamp((VT[1]-p.y)/(VT[1]-VT[0]),0,1)*100;if(v>G.lvl+.3){G.pourFx=.25;sfx(blip);}G.lvl=v;}
  else{
    const key=b==='T'?'puff':'wedgie',dx=p.x-q.x,dy=p.y-q.y;
    let v=G[key];
    if(first||Math.abs(dx)>=Math.abs(dy))v=clamp((p.x-HT[0])/(HT[1]-HT[0]),0,1)*100;   // slide sideways
    else v=clamp(v-dy*.5,0,100);                                                            // or swipe up/down
    if(b==='T'&&v>G.puff+1)sfx(fluffSnd);
    if(b==='B'&&v<G.wedgie-1)sfx(tugSnd);
    G[key]=v;
  }
  q.x=p.x;q.y=p.y;
}
function syncHeld(){G.held={};for(const k in ptr)G.held[ptr[k].bar]=1;}
cv.addEventListener('pointerdown',e=>{
  au();const p=pos(e);
  if(state==='title'){newGame();state='play';return;}
  if(state==='end'){if(G.overT>.8){newGame();state='play';}return;}
  const bar=barAt(p);if(!bar)return;
  const q=ptr[e.pointerId]={bar:bar,x:p.x,y:p.y};
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  setBar(q,p,true);syncHeld();
});
cv.addEventListener('pointermove',e=>{const q=ptr[e.pointerId];if(state==='play'&&q)setBar(q,pos(e),false);});
function release(e){delete ptr[e.pointerId];if(G)syncHeld();}
addEventListener('pointerup',release);
addEventListener('pointercancel',release);
addEventListener('keydown',e=>{
  if(state!=='play'){if(e.key===' '||e.key==='Enter'){au();if(state==='title'||G.overT>.8){newGame();state='play';}}return;}
  const k=e.key;
  if(k==='ArrowUp')G.target=clamp(G.target+5,0,90);
  if(k==='ArrowDown')G.target=clamp(G.target-5,0,90);
  if(k==='w'||k==='W')G.lvl=clamp(G.lvl+6,0,100);
  if(k==='s'||k==='S')G.lvl=clamp(G.lvl-6,0,100);
  if(k==='e'||k==='E')G.puff=clamp(G.puff+8,0,100);
  if(k==='q'||k==='Q')G.puff=clamp(G.puff-8,0,100);
  if(k==='z'||k==='Z')G.wedgie=clamp(G.wedgie-12,0,100);
});

/* ---------- loop ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(state==='play')update(dt);
  else if(state==='end')G.overT+=dt;
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
